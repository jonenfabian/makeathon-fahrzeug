name: Laptop-Start
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  start:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Python-Pakete installieren
        run: python -m pip install -r requirements.txt
      - name: Firmware-Host bauen (Unix)
        if: runner.os != 'Windows'
        run: python build_runtime.py
      - name: Firmware-Host bauen (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          python build_runtime.py
      - name: Simulationen prüfen
        run: python smoke.py
      - name: Geprüften Simulator sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.os }}
          path: runtime-built/
          retention-days: 14
